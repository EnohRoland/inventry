name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: inventory
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U inventory -d inventory" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
        env:
          DATABASE_URL: postgres://inventory:ci-test-password@localhost:5432/inventory
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '1.11.4' }
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/bootstrap init -backend=false
      - run: terraform -chdir=infra/bootstrap validate
      - uses: azure/setup-helm@v4.3.0
        with: { version: v3.17.3 }
      - run: helm lint deploy/chart --set ingress.certificateArn=arn:aws:acm:us-east-1:123456789012:certificate/test
      - run: helm template inventory deploy/chart --set ingress.certificateArn=arn:aws:acm:us-east-1:123456789012:certificate/test > /tmp/inventory.yaml
      - run: bash -n scripts/bootstrap-cluster.sh scripts/deploy.sh
  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix: { tier: [backend, frontend] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.tier }}/Dockerfile
          push: false
          load: true
          tags: inventory-${{ matrix.tier }}:ci
          cache-from: type=gha,scope=${{ matrix.tier }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tier }}
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: inventory-${{ matrix.tier }}:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
