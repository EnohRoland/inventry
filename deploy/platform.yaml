apiVersion: v1
kind: Namespace
metadata:
  name: goshenignite
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: goshenignite
rules:
  - apiGroups: ["", apps, batch, networking.k8s.io, autoscaling, policy]
    resources: [configmaps, secrets, services, serviceaccounts, pods, pods/log, deployments, replicasets, jobs, ingresses, networkpolicies, horizontalpodautoscalers, poddisruptionbudgets, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: goshenignite
subjects:
  - kind: Group
    name: goshenignite-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: deployer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: goshenignite
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inventory-db
  namespace: goshenignite
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: inventory-db
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: ${APPLICATION_SECRET_ARN}
        property: DATABASE_URL
